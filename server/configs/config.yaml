server:
  addr: ":8090"
  secure_cookies: false # Set true when serving over HTTPS.
  trusted_proxies: [] # Set to the IPs/CIDRs of proxies that supply X-Forwarded-For.
data:
  account_id: "replace-with-account-id"
  database_id: "replace-with-database-id"
  token_env: "CLOUDFLARE_API_KEY"
credits:
  first_mark_reward: 10
  invitation_rewards: [2, 1]
  max_confirmations_per_account: 3
  max_reward_per_account: 39
  invitation_cost: 100
